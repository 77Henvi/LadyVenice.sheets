<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Migrate Data to Supabase</title>
</head>
<body style="font-family: sans-serif; padding: 40px;">
  
  <h2>🔄 กำลังย้ายข้อมูลไป Supabase...</h2>
  <p>กรุณากด <b>F12</b> แล้วเปิดแท็บ <b>Console</b> เพื่อดูสถานะการทำงานครับ</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔴 1. เอาโค้ดจากไฟล์ firebase-config.js เดิมของคุณ มาแปะแทนที่ตรงนี้นะครับ
    const firebaseConfig = {
        apiKey: "AIzaSyC0Txa5vnZbRtYU2wMTb2Qe3heGgF-SV4w",
        authDomain: "ladyvenice.firebaseapp.com",
        projectId: "ladyvenice",
        storageBucket: "ladyvenice.firebasestorage.app",
        messagingSenderId: "143412816674",
        appId: "1:143412816674:web:ce46a0bbee26437722537b"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🟢 2. กุญแจบ้านใหม่ Supabase ของคุณ (ผมใส่ไว้ให้แล้ว)
    const SUPABASE_URL = "https://nrmnahfsqqwyuqzareor.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UyL_StRZr363Cof4NBqxIg_mGigxG3f";

    async function insertToSupabase(table, dataArray) {
      if (dataArray.length === 0) return;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(dataArray)
      });
      if (!res.ok) console.error(`❌ Error ย้าย ${table}:`, await res.text());
      else console.log(`✅ ย้ายข้อมูลลงตาราง ${table} สำเร็จ (${dataArray.length} รายการ)`);
    }

    async function migrateData() {
      const tables = ['finance', 'orders', 'stock', 'todos'];
      for (const table of tables) {
        console.log(`⏳ กำลังดึงข้อมูล ${table} จาก Firebase...`);
        const snap = await getDocs(collection(db, table));
        const dataArray = [];
        snap.forEach(doc => dataArray.push(doc.data()));
        await insertToSupabase(table, dataArray);
      }
      console.log("🎉🎉 ย้ายข้อมูลเสร็จสมบูรณ์!! ไปเช็กใน Supabase ได้เลยครับ");
    }

    migrateData();
  </script>
</body>
</html>
